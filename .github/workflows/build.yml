name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      # 仅发布 Android arm64-v8a（v8）包，不再构建 PC / Windows
      - working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
      - name: Package arm64-v8a
        working-directory: mobile
        run: cp build/app/outputs/flutter-apk/app-release.apk Noqi-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: noqi-android-arm64-v8a
          path: mobile/Noqi-arm64-v8a.apk
